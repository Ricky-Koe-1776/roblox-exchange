<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Exchange · Buy and sell Roblox games</title>
  <meta name="description" content="Browse Roblox games for sale with live player counts, visits and asking prices. Pay in USDC; funds are held until the group transfer is confirmed." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://tr.rbxcdn.com" />
  <meta property="og:title" content="Roblox Exchange" />
  <meta property="og:description" content="Roblox games for sale, with live player counts and asking prices. Pay in USDC, held until the transfer is confirmed." />
  <meta property="og:image" content="https://robloxexchange.com/og-image.png" />
  <meta property="og:url" content="https://robloxexchange.com" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://robloxexchange.com/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #fbfbfc;
      --surface-2: #eaecef;
      --ink: #111317;
      --ink-2: #353a43;
      --muted: #646b77;
      --line: #dfe2e7;
      --line-strong: #c6cbd3;
      --accent: #0b7a4b;
      --accent-ink: #f2fbf6;
      --accent-soft: #dcf3e7;
      --warn: #9a5a00;
      --warn-bg: #fbeed6;
      --info: #22508f;
      --info-bg: #dfe9f7;
      --danger: #b3321f;
      --shadow: 0 1px 0 rgba(17, 19, 23, .04), 0 12px 28px -18px rgba(17, 19, 23, .28);
      /* Radius system: controls (buttons, inputs, thumbs) 10px, containers (cards, panels, tiles) 16px, chips/pills full. */
      --r-ctl: 10px;
      --r-box: 16px;
      --display: 'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, sans-serif;
      --body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f12;
        --surface: #15181d;
        --surface-2: #1d2128;
        --ink: #eef0f3;
        --ink-2: #c9ced6;
        --muted: #8e95a2;
        --line: #252a32;
        --line-strong: #353b45;
        --accent: #4fd69c;
        --accent-ink: #06150e;
        --accent-soft: #12301f;
        --warn: #f0b45a;
        --warn-bg: #36280f;
        --info: #8db4ef;
        --info-bg: #1a2840;
        --danger: #f2826f;
        --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 14px 32px -20px rgba(0, 0, 0, .85);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    a, button, select, .chip, .card, .tile { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card:focus-visible, .tile:focus-visible { outline-offset: 3px; }
    h1, h2 { text-wrap: balance; }
    p { text-wrap: pretty; }
    #market { scroll-margin-top: 72px; }
    .skip { position: absolute; left: 16px; top: -48px; z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r-ctl); font-weight: 700; text-decoration: none; }
    .skip:focus { top: 12px; }
    body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; min-height: 100vh; display: flex; flex-direction: column; }
    #app { flex: 1; display: flex; flex-direction: column; }
    a { color: inherit; }
    img { display: block; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 48px); }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .muted { color: var(--muted); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* ── Top bar ─────────────────────────────────────────── */
    .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .topbar .wrap { display: flex; align-items: center; gap: 28px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
    .brand-mark { width: 26px; height: 26px; border-radius: var(--r-ctl); background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0; }
    .nav { display: flex; gap: 4px; flex: 1; }
    .nav a { text-decoration: none; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .nav a:hover { color: var(--ink); background: var(--surface-2); }
    .nav a.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
    .me { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .me img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--surface-2); }
    .me-name { font-size: 14px; font-weight: 600; }

    /* ── Buttons & inputs ────────────────────────────────── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-ctl); padding: 10px 16px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; background: var(--ink); color: var(--bg); transition: transform .08s ease, opacity .15s; }
    .btn:hover { opacity: .9; }
    .btn:active { transform: translateY(1px); }
    .btn.go { background: var(--accent); color: var(--accent-ink); }
    .btn.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
    .btn.quiet:hover { background: var(--surface); opacity: 1; }
    .btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1px var(--line-strong); }
    .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: var(--r-ctl); }
    .btn.lg { padding: 14px 20px; font-size: 15px; border-radius: var(--r-ctl); }
    .btn.block { width: 100%; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .field { display: block; margin-bottom: 16px; }
    .field > span { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .field > small { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .input { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 11px 13px; font-size: 14px; outline: none; }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    textarea.input { min-height: 120px; resize: vertical; }

    /* ── Hero ────────────────────────────────────────────── */
    .hero { padding: clamp(32px, 5vw, 72px) 0 clamp(36px, 5vw, 64px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(32px, 4vw, 72px); align-items: center; }
    .hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 4.8vw, 76px); line-height: 1; letter-spacing: -.035em; }
    .hero h1 em { font-style: normal; color: var(--accent); }
    .hero p { margin-top: 20px; font-size: clamp(16px, 1.2vw, 19px); color: var(--ink-2); max-width: 44ch; }
    .hero-ctas { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }

    /* Featured: one large game + two stacked, captions under the art. */
    .bento { display: grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; }
    .tile { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); overflow: hidden; text-decoration: none; transition: transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .25s; }
    .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .tile.big { grid-row: span 2; }
    .tile-img { position: relative; flex: 1; min-height: 0; background: var(--surface-2); overflow: hidden; }
    .tile-img img, .tile-img .noimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.16, 1, .3, 1); }
    .tile:hover .tile-img img { transform: scale(1.04); }
    .tile.big .tile-img { aspect-ratio: 1 / 1; }
    .tile-cap { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .tile-cap .t { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-cap .s { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tile-cap .p { font-family: var(--mono); font-weight: 700; font-size: 17px; letter-spacing: -.03em; white-space: nowrap; }
    .tile.big .tile-cap { padding: 16px 18px; }
    .tile.big .tile-cap .t { font-size: 18px; }
    .tile.big .tile-cap .p { font-size: 22px; }

    /* Live numbers band: its own section, not part of the hero. */
    .band { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
    .band .wrap { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 24px; padding-top: 22px; padding-bottom: 22px; }
    .band .v { font-family: var(--mono); font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -.04em; line-height: 1.1; }
    .band .k { font-size: 14px; color: var(--muted); }

    /* ── Game cards ──────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 18px; }
    .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); overflow: hidden; text-decoration: none; transition: transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .25s, border-color .25s; }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--line-strong); }
    .card:active, .tile:active { transform: translateY(-1px) scale(.99); }
    .card-img { position: relative; aspect-ratio: 1 / 1; background: var(--surface-2); overflow: hidden; }
    .card-img img, .card-img .noimg { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.16, 1, .3, 1); }
    .card:hover .card-img img { transform: scale(1.04); }
    .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .card-title { font-weight: 700; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
    .card-meta { display: flex; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .card-meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .card-meta i { font-size: 14px; }
    .card-price { font-family: var(--mono); font-weight: 700; font-size: 19px; letter-spacing: -.03em; margin-top: auto; }
    .view-toggle { display: inline-flex; background: var(--surface-2); border-radius: var(--r-ctl); padding: 3px; gap: 2px; }
    .view-toggle button { border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
    .view-toggle button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

    /* Skeletons */
    .sk { background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%); background-size: 200% 100%; border-radius: 6px; }
    .sk-card .card-img { background: var(--surface-2); }
    .sk-line { height: 12px; margin-top: 2px; }

    /* ── How buying works: steps in a vertical list beside the heading ── */
    .how { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 96px); padding: clamp(56px, 7vw, 104px) 0; border-top: 1px solid var(--line); }
    .how h2 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 3vw, 46px); letter-spacing: -.03em; line-height: 1.05; }
    .how-list { list-style: none; display: grid; gap: 0; }
    .how-list li { display: grid; grid-template-columns: 44px 1fr; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .how-list li:first-child { padding-top: 0; }
    .how-list li:last-child { border-bottom: 0; }
    .how-list .ic { width: 44px; height: 44px; border-radius: var(--r-ctl); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 22px; }
    .how-list b { display: block; font-size: 17px; margin-bottom: 4px; }
    .how-list p { color: var(--muted); max-width: 52ch; }

    /* ── Sell call to action ─────────────────────────────── */
    .sellband { margin-bottom: 72px; background: var(--ink); color: var(--bg); border-radius: var(--r-box); padding: clamp(28px, 4vw, 52px); display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .sellband h2 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 2.6vw, 38px); letter-spacing: -.03em; line-height: 1.1; }
    .sellband p { margin-top: 8px; opacity: .75; max-width: 46ch; }
    .sellband .btn { background: var(--accent); color: var(--accent-ink); }

    /* ── Entry motion (honours reduced motion) ───────────── */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes shimmer { to { background-position: -200% 0; } }
      .rise { animation: rise .7s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
      .sk { animation: shimmer 1.4s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

    /* ── Market list ─────────────────────────────────────── */
    .section-title { font-family: var(--display); font-size: clamp(26px, 2.4vw, 36px); font-weight: 800; letter-spacing: -.025em; }
    .market-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .count { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .search { position: relative; flex: 1 1 260px; }
    .search input { padding-left: 38px; }
    .search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; pointer-events: none; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
    .chip:hover { background: var(--surface); }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    select.input { width: auto; padding-right: 34px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }

    .table { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); overflow: hidden; box-shadow: var(--shadow); }
    .trow { display: grid; grid-template-columns: minmax(0, 1fr) 110px 120px 100px 130px; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); text-decoration: none; }
    .trow:last-child { border-bottom: 0; }
    .trow.th { padding-top: 11px; padding-bottom: 11px; background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .trow.th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
    .trow.th button.on { color: var(--ink); }
    a.trow:hover { background: color-mix(in srgb, var(--accent-soft) 30%, var(--surface)); }
    .r { text-align: right; justify-content: flex-end; }
    .game { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .game img, .game .noimg { width: 48px; height: 48px; border-radius: var(--r-ctl); object-fit: cover; background: var(--surface-2); flex-shrink: 0; border: 1px solid var(--line); }
    .game-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: none; }
    .cell { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
    .cell.price { font-weight: 700; color: var(--ink); font-size: 15px; }
    .playing { display: inline-flex; align-items: center; gap: 6px; }
    .playing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .playing.zero i { background: var(--line-strong); }
    .more { display: flex; justify-content: center; margin: 22px 0 8px; }
    .empty { padding: 56px 20px; text-align: center; color: var(--muted); }
    .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

    /* ── Page scaffolding ────────────────────────────────── */
    .page { padding: 36px 0 72px; flex: 1; }
    .page-head { margin-bottom: 26px; }
    .page-head h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 4vw, 40px); letter-spacing: -.03em; line-height: 1.05; }
    .page-head p { color: var(--muted); margin-top: 8px; max-width: 620px; }
    .back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; margin-bottom: 22px; }
    .back:hover { color: var(--ink); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); padding: 24px; box-shadow: var(--shadow); }
    .narrow { max-width: 620px; }

    /* ── Listing detail ──────────────────────────────────── */
    .detail { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 36px; align-items: start; }
    .detail-top { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 28px; }
    .detail-top img, .detail-top .noimg { width: 168px; height: 168px; border-radius: var(--r-box); object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); flex-shrink: 0; }
    .detail-top h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 3.6vw, 40px); letter-spacing: -.03em; line-height: 1.05; word-break: break-word; }
    .detail-links { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
    .detail-links a { color: var(--accent); text-decoration: none; }
    .detail-links a:hover { text-decoration: underline; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-box); background: var(--surface); margin-bottom: 28px; }
    .stats > div { padding: 16px 18px; }
    .stats > div + div { border-left: 1px solid var(--line); }
    .stats .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .stats .v { font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: -.03em; margin-top: 4px; }
    .prose-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
    .prose { white-space: pre-wrap; word-break: break-word; color: var(--ink-2); font-size: 15px; line-height: 1.7; }
    .buy { position: sticky; top: 88px; }
    .buy-price { font-family: var(--mono); font-size: 38px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
    .buy-cur { font-size: 13px; color: var(--muted); margin-top: 6px; margin-bottom: 20px; }
    .steps { list-style: none; margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 14px; counter-reset: s; }
    .steps li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 13px; color: var(--muted); counter-increment: s; }
    .steps li::before { content: counter(s); font-family: var(--mono); font-weight: 700; font-size: 12px; color: var(--ink); width: 22px; height: 22px; border-radius: var(--r-ctl); background: var(--surface-2); display: grid; place-items: center; }
    .steps li b { color: var(--ink); display: block; font-size: 14px; }
    .note { font-size: 13px; color: var(--muted); margin-top: 12px; text-align: center; }

    /* ── Orders, wallet, admin ───────────────────────────── */
    .seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-ctl); padding: 4px; gap: 4px; margin-bottom: 18px; }
    .seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: var(--r-ctl); font-weight: 700; font-size: 14px; cursor: pointer; color: var(--muted); }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); overflow: hidden; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--line); text-decoration: none; }
    .list-row:last-child { border-bottom: 0; }
    a.list-row:hover { background: var(--surface-2); }
    .list-row .t { font-weight: 700; }
    .list-row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
    .pill.awaiting_payment { background: var(--warn-bg); color: var(--warn); }
    .pill.paid { background: var(--info-bg); color: var(--info); }
    .pill.completed { background: var(--accent-soft); color: var(--ink); }
    .track { list-style: none; margin: 22px 0; display: grid; gap: 0; }
    .track li { display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding-bottom: 18px; position: relative; color: var(--muted); }
    .track li:not(:last-child)::after { content: ''; position: absolute; left: 13px; top: 28px; bottom: 2px; width: 2px; background: var(--line); }
    .track .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; background: var(--surface); }
    .track li.done { color: var(--ink-2); }
    .track li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .track li.done:not(:last-child)::after { background: var(--accent); }
    .track li.now .dot { border-color: var(--accent); color: var(--accent); }
    .track li.now { color: var(--ink-2); }
    .track b { display: block; color: var(--ink); font-size: 15px; }
    .track span { font-size: 13px; }
    .addr { font-family: var(--mono); font-size: 14px; word-break: break-all; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: var(--r-ctl); padding: 14px; margin: 8px 0 14px; }
    .callout { background: var(--surface-2); border-radius: var(--r-ctl); padding: 14px 16px; font-size: 14px; color: var(--ink-2); margin-top: 14px; }
    .bal { font-family: var(--mono); font-size: 46px; font-weight: 700; letter-spacing: -.04em; line-height: 1.05; margin: 6px 0 24px; }
    .amt-pos { color: var(--accent); font-family: var(--mono); font-weight: 700; }
    .amt-neg { color: var(--danger); font-family: var(--mono); font-weight: 700; }
    .gate { text-align: center; padding: 56px 24px; }
    .gate h2 { font-family: var(--display); font-size: 26px; letter-spacing: -.02em; margin-bottom: 8px; }
    .gate p { color: var(--muted); margin-bottom: 20px; }

    /* ── Footer & toast ──────────────────────────────────── */
    footer { border-top: 1px solid var(--line); padding: 28px 0 40px; font-size: 13px; color: var(--muted); }
    footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
    .toast.bad { background: var(--danger); color: #fff; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 960px) {
      .hero { grid-template-columns: 1fr; gap: 32px; padding-top: 40px; }
      .how { grid-template-columns: 1fr; }
      .detail { grid-template-columns: 1fr; }
      .buy { position: static; }
      .trow { grid-template-columns: minmax(0, 1fr) 100px 120px; }
      .trow > .c-visits, .trow > .c-favs { display: none; }
    }
    @media (max-width: 720px) {
      .wrap { padding: 0 16px; }
      .topbar .wrap { gap: 12px; height: auto; min-height: 58px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
      .nav { order: 3; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
      .nav::-webkit-scrollbar { display: none; }
      .me { margin-left: auto; }
      .me-name { display: none; }
      .bento { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
      .tile.big { grid-column: span 2; grid-row: auto; }
      .tile:not(.big) .tile-img { aspect-ratio: 1 / 1; flex: none; }
      .band .wrap { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .band .k { font-size: 12px; }
      .card-meta { gap: 8px; }
      .card-meta span:nth-child(2) { display: none; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .card { border-radius: var(--r-box); }
      .card-body { padding: 10px 11px 12px; }
      .card-title { font-size: 14px; }
      .card-price { font-size: 16px; }

      .trow { grid-template-columns: minmax(0, 1fr) auto; padding: 12px 14px; gap: 12px; }
      .trow > .c-play { display: none; }
      .trow.th { display: none; }
      .game-sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .game img, .game .noimg { width: 44px; height: 44px; }
      .detail-top { gap: 16px; }
      .detail-top img, .detail-top .noimg { width: 84px; height: 84px; border-radius: var(--r-box); }
      .stats .v { font-size: 19px; }
      .stats > div { padding: 12px 14px; }
      .panel { padding: 18px; }
      .controls { flex-direction: column; align-items: stretch; }
      .controls .view-toggle { align-self: flex-start; }
      .search { flex: none; }
      .controls .input, .controls select.input { width: 100%; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -16px; margin-right: -16px; padding: 0 16px; }
      .chips::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
