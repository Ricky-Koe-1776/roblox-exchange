<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Exchange — Buy &amp; sell Roblox games</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta property="og:title" content="Roblox Exchange" />
  <meta property="og:description" content="The marketplace for Roblox game acquisitions. Ownership-verified, USDC escrow." />
  <meta property="og:image" content="https://robloxexchange.com/og-image.png" />
  <meta property="og:url" content="https://robloxexchange.com" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://robloxexchange.com/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1014;
      --panel: #161a21;
      --panel-2: #1d222b;
      --line: #272d38;
      --text: #e7ebf2;
      --muted: #8b94a3;
      --accent: #4ade80;
      --accent-dim: #1f3a2b;
      --danger: #f87171;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
    a { color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

    header { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(14,16,20,.9); backdrop-filter: blur(8px); z-index: 10; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: -.3px; }
    .logo span { color: var(--accent); }
    .who { color: var(--muted); font-size: 14px; }
    .who b { color: var(--text); }
    .nav-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; margin-right: 8px; vertical-align: middle; }

    .tabs { display: flex; gap: 4px; margin: 22px 0 18px; flex-wrap: wrap; }
    .tab { padding: 8px 14px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--panel); }
    .tab.active { background: var(--accent); color: #07120c; border-color: var(--accent); }
    .tab:hover { border-color: var(--accent); }

    .btn { background: var(--accent); color: #07120c; border: none; border-radius: 8px; padding: 9px 16px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-block; text-decoration: none; }
    .btn:hover { filter: brightness(1.08); }
    .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
    .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    input, select, textarea { font-family: inherit; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .muted { color: var(--muted); }
    .row { display: flex; align-items: center; gap: 10px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); padding: 12px 18px; border-radius: 10px; font-weight: 600; z-index: 60; }
    .toast.ok { border-color: var(--accent); }
    .toast.bad { border-color: var(--danger); color: var(--danger); }

    .hero { text-align: center; padding: 60px 0 30px; }
    .hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -.8px; }
    .hero p { color: var(--muted); margin-top: 12px; max-width: 540px; margin-inline: auto; }
    .login { max-width: 360px; margin: 24px auto; text-align: center; }
    .login .btn { width: 100%; padding: 13px; font-size: 15px; }
    .login p.fine { font-size: 12px; color: var(--muted); margin-top: 12px; }

    /* Game marketplace */
    .mkt-subtabs { display: flex; gap: 4px; margin: 0 0 18px; flex-wrap: wrap; }
    .mkt-subtab { padding: 8px 14px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 13px; border: 1px solid var(--line); background: var(--panel); }
    .mkt-subtab.active { background: var(--accent); color: #07120c; border-color: var(--accent); }
    .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .listing-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color .1s; }
    .listing-card:hover { border-color: var(--accent); }
    .listing-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--panel-2); display: block; }
    .listing-thumb-ph { width: 100%; aspect-ratio: 16/9; background: var(--panel-2); }
    .listing-body { padding: 12px 14px; }
    .listing-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .listing-price { color: var(--accent); font-weight: 800; font-size: 16px; }
    .listing-stats { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .listing-detail { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; }
    .listing-detail-thumb { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
    .listing-detail-thumb-ph { width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
    .listing-desc { white-space: pre-wrap; color: var(--text); margin: 14px 0; line-height: 1.6; }
    .buy-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; position: sticky; top: 80px; }
    .buy-price { font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .buy-sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .order-track { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }
    .order-step { display: flex; gap: 12px; align-items: flex-start; opacity: .5; }
    .order-step.done { opacity: 1; }
    .order-step.active { opacity: 1; }
    .order-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin-top: 1px; }
    .order-step.done .order-dot { background: var(--accent); border-color: var(--accent); color: #07120c; }
    .order-step.active .order-dot { border-color: var(--accent); color: var(--accent); }
    .order-step-title { font-weight: 700; font-size: 14px; }
    .order-step-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .pay-address { background: var(--panel-2); border: 1px dashed var(--accent); border-radius: 8px; padding: 12px; margin: 10px 0; font-weight: 700; color: var(--accent); word-break: break-all; text-align: center; font-size: 13px; }
    .sell-form label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 14px 0 6px; font-weight: 700; }
    .sell-form input, .sell-form textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 10px 12px; font-family: inherit; font-size: 14px; }
    .sell-form textarea { min-height: 100px; resize: vertical; }
    .sell-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .wallet-balance { font-size: 36px; font-weight: 800; color: var(--accent); margin: 6px 0 18px; }
    .ledger-row { display: flex; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .ledger-amt.pos { color: var(--accent); font-weight: 700; }
    .ledger-amt.neg { color: var(--danger); font-weight: 700; }
    .order-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
    .order-card:hover { border-color: var(--accent); }
    .order-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .status-chip { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; padding: 3px 9px; border-radius: 999px; }
    .status-awaiting_payment { background: #3a3520; color: var(--gold); }
    .status-paid { background: #2a3a55; color: #7db5ff; }
    .status-completed { background: var(--accent-dim); color: var(--accent); }
    .status-cancelled, .status-refunded { background: var(--panel-2); color: var(--muted); }

    @media (max-width: 768px) {
      .listing-detail { grid-template-columns: 1fr; }
      .buy-box { position: static; }
      .nav { flex-wrap: wrap; height: auto; padding: 10px 0; }
      .tabs { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 2px; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { white-space: nowrap; flex-shrink: 0; }
      .wrap { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/app.js"></script>
</body>
</html>
